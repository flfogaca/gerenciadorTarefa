version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gestorpro-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gestorpro_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - gestorpro-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gestorpro-redis-dev
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    networks:
      - gestorpro-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: gestorpro-mailhog-dev
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - gestorpro-dev-network

networks:
  gestorpro-dev-network:
    driver: bridge

volumes:
  postgres-dev-data:
  redis-dev-data:





